name: Auto News

on:
  schedule:
    - cron: "0 */2 * * *"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4

      - run: pip install feedparser requests python-wordpress-xmlrpc

      - run: python script.py
